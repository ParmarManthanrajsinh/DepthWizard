[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "depthwizard"
version = "0.1.0"
description = "Single-View Height Estimation and 3D Flythrough (ISRO SAC - SIH26175)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pillow>=10.3.0",
    "contourpy>=1.2.0",
]

[project.optional-dependencies]
mesh = [
    "trimesh>=4.4.0",
]
ml = [
    "torch>=2.2.0",
    "transformers>=4.41.0",
]
geo = [
    "rasterio>=1.3.10",
]
all = [
    "trimesh>=4.4.0",
    "torch>=2.2.0",
    "transformers>=4.41.0",
    "rasterio>=1.3.10",
]
